name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  IOS_PRESET: iOS
  NAME: Rogue

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create dummy icon
        run: |
          sips -s format png -z 1024 1024 /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns --out icon.png

      - name: Install coreutils
        run: brew install coreutils

      - name: Import assets
        continue-on-error: true
        run: |
          gtimeout 120 godot --headless --path . -e || true

      - name: Fake export to import assets
        run: |
          mkdir -p build
          godot --headless --path . --export-pack "${IOS_PRESET}" build/app.pck || true

      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "${IOS_PRESET}" build/ios 2>&1 | tee export.log

      - name: Build unsigned archive
        run: |
          PROJ=$(find build/ios -name "*.xcodeproj" | head -n1)
          if [ -z "$PROJ" ]; then
            echo "Xcode project not found! Check export.log"
            cat export.log
            exit 1
          fi
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "Rogue.ipa" Payload
          mv "Rogue.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: Rogue.ipa
          retention-days: 14

      - name: Upload Export Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          retention-days: 14
