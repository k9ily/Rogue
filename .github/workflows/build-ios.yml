name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  IOS_PRESET: iOS
  NAME: ${{ github.event.repository.name }}

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create build dir
        run: mkdir -p build

      - name: Fake export to import assets
        run: |
          godot --headless --path . --export-pack "${IOS_PRESET}" build/app.pck || true

      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --path . --verbose --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project build/ios/${NAME}.xcodeproj \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.NAME }}.ipa
          retention-days: 14
