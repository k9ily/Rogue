name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  IOS_PRESET: iOS
  NAME: Rogue

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create build dir
        run: mkdir -p build/ios

      - name: Import project
        continue-on-error: true
        run: |
          godot --headless --path . --editor --quit || true

      - name: Export to Xcode project
        run: |
          godot --headless --path . --export-release "iOS" build/ios

      - name: Build unsigned archive
        run: |
          PROJ=$(find build/ios -name "*.xcodeproj" | head -n1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.NAME }}.ipa
          retention-days: 14
