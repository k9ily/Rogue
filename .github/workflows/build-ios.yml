name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  IOS_PRESET: iOS
  NAME: Rogue

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create dummy icon
        run: |
          sips -s format png -z 1024 1024 /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns --out icon.png

      - name: Generate export_presets.cfg
        run: |
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="ABCDE12345"
          application/provisioning_profile_uuid_debug=""
          application/code_sign_identity_debug=""
          application/export_method_debug=0
          application/provisioning_profile_uuid_release=""
          application/code_sign_identity_release=""
          application/export_method_release=0
          application/targeted_device_family=2
          application/bundle_identifier="com.example.roguelike"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/icon_interpolation=4
          application/launch_screens_interpolation=4
          capabilities/access_wifi=true
          capabilities/push_notifications=false
          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          privacy/camera_usage_description=""
          privacy/camera_usage_description_localized={}
          privacy/microphone_usage_description=""
          privacy/microphone_usage_description_localized={}
          privacy/photolibrary_usage_description=""
          privacy/photolibrary_usage_description_localized={}
          icons/iphone_120x120="res://icon.png"
          icons/iphone_180x180="res://icon.png"
          icons/ipad_76x76="res://icon.png"
          icons/ipad_152x152="res://icon.png"
          icons/ipad_167x167="res://icon.png"
          icons/app_store_1024x1024="res://icon.png"
          icons/spotlight_40x40="res://icon.png"
          icons/spotlight_80x80="res://icon.png"
          icons/settings_58x58="res://icon.png"
          icons/settings_87x87="res://icon.png"
          icons/notification_40x40="res://icon.png"
          icons/notification_60x60="res://icon.png"
          storyboard/use_launch_screen_storyboard=false
          storyboard/image_scale_mode=0
          EOF

      - name: Fake export to import assets
        run: |
          mkdir -p build
          godot --headless --path . --export-pack "${IOS_PRESET}" build/app.pck || true

      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "${IOS_PRESET}" build/ios 2>&1 | tee export.log

      - name: Build unsigned archive
        run: |
          PROJ=$(find build/ios -name "*.xcodeproj" | head -n1)
          if [ -z "$PROJ" ]; then
            echo "Xcode project not found! Check export.log"
            cat export.log
            exit 1
          fi
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "Rogue.ipa" Payload
          mv "Rogue.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: Rogue.ipa
          retention-days: 14

      - name: Upload Export Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          retention-days: 14
