name: Deploy Web Version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PNG icon and patch project.godot
        run: |
          # Создаем правильную PNG-картинку на лету
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > icon.png
          # Принудительно меняем иконку в project.godot
          sed -i 's|config/icon="res://icon.svg"|config/icon="res://icon.png"|g' project.godot

      - name: Generate minimal export_presets.cfg
        run: |
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          export_filter="all_resources"
          export_path="build/web/index.html"

          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=false
          progressive_web_app/enabled=false
          EOF

      - name: Export with firebelley action
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
