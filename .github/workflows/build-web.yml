name: Deploy Web Version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate minimal export_presets.cfg
        run: |
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          export_filter="all_resources"
          export_path="index.html"
          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=false
          progressive_web_app/enabled=false
          EOF

      - name: Export with firebelley action
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true      # <-- Заставляем создать ZIP
          archive_name: "web-build" # <-- Явно задаем имя архива

      - name: Prepare Artifact
        run: |
          mkdir -p public
          # Ищем наш ZIP-файл в папке build
          ZIP_FILE=$(find build -name "*.zip" | head -n1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Архив не найден в build, ищем везде..."
            ZIP_FILE=$(find . -name "*.zip" | grep -v ".git" | head -n1)
          fi
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: Архив так и не был создан!"
            exit 1
          fi
          
          echo "Найден архив: $ZIP_FILE"
          
          # Распаковываем
          mkdir -p temp_unzip
          unzip -q "$ZIP_FILE" -d temp_unzip
          
          # Ищем index.html (он может быть в корне архива или в подпапке)
          INDEX_FILE=$(find temp_unzip -name "index.html" | head -n1)
          DIR_NAME=$(dirname "$INDEX_FILE")
          
          # Копируем всё в public
          cp -r "$DIR_NAME"/* public/
          
          echo "Содержимое public:"
          ls -la public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
