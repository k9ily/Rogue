name: Deploy Web Version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Create dummy icon and patch project
        run: |
          # Создаем правильную PNG картинку (1x1 пиксель)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > icon.png
          # Меняем в настройках проекта иконку с svg на png
          sed -i 's|config/icon="res://icon.svg"|config/icon="res://icon.png"|g' project.godot

      - name: Generate export_presets.cfg
        run: |
          # Создаем идеальный конфиг для Web
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          export_filter="all_resources"
          export_path="build/web/index.html"

          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=false
          progressive_web_app/enabled=false
          EOF

      - name: Clear cache and Import
        run: |
          rm -rf .godot
          godot --headless --path . --import || true

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
