name: Deploy Web Version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PNG icon and patch project.godot
        run: |
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > icon.png
          sed -i 's|config/icon="res://icon.svg"|config/icon="res://icon.png"|g' project.godot

      - name: Generate minimal export_presets.cfg
        run: |
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          export_filter="all_resources"
          export_path="web_build"

          [preset.0.options]
          variant/extensions_support=false
          variant/thread_support=false
          html/export_icon=false
          progressive_web_app/enabled=false
          EOF

      - name: Export with firebelley action
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./

      - name: Prepare Artifact
        run: |
          mkdir -p public
          # Просто ищем index.html во всей папке проекта
          INDEX_FILE=$(find . -name "index.html" | head -n1)
          
          if [ -z "$INDEX_FILE" ]; then
            echo "ОШИБКА: index.html не найден!"
            find . -type f
            exit 1
          fi
          
          echo "Файл найден по пути: $INDEX_FILE"
          
          # Берем папку, в которой лежит index.html, и копируем всё оттуда в public
          DIR_NAME=$(dirname "$INDEX_FILE")
          cp -r "$DIR_NAME"/* public/
          
          echo "Содержимое папки public:"
          ls -la public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
